name = "linkup-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Workers AI Binding
[ai]
binding = "AI"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "linkup-db"
database_id = "8f2745e9-0943-45ef-8a5e-4b15f494d023"

# R2 Bucket Binding
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "linkup-storage"

# KV Namespace (セッション・QRキャッシュ用)
# [[kv_namespaces]]
# binding = "KV"
# id = "to-be-created"


# Environment Variables
[vars]
ENVIRONMENT = "production"
JWT_SECRET = "your-jwt-secret-change-in-production"
FRONTEND_URL = "https://link-up.live"
APP_NAME = "LinkUp"
APP_TAGLINE = "人と機会を繋げる"

# Secrets (wrangler secret putで設定)
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# GEMINI_API_KEY
# NTT_API_KEY
# NTT_API_SECRET

# [build]
# command = "npm run build"

# 開発環境
[env.development]
name = "linkup-backend-dev"
vars = { ENVIRONMENT = "development", FRONTEND_URL = "http://localhost:3000" }

# ステージング環境
[env.staging]
name = "linkup-backend-staging"
vars = { ENVIRONMENT = "staging", FRONTEND_URL = "https://staging.linkup.example.com" }
