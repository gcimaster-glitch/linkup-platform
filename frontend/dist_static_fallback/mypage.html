<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wallet - LinkUp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563EB',
                        secondary: '#1E40AF',
                        dark: '#0F172A',
                        background: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F8FAFC; }
        .ticket-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .ticket-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
        .qr-glow { animation: pulse-glow 2s infinite; }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0px rgba(37, 99, 235, 0.2); }
            50% { box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
        }
    </style>
</head>
<body class="text-slate-800 antialiased pb-24">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center cursor-pointer" onclick="window.location.href='/'">
                <span class="material-icons-outlined text-2xl text-slate-400 mr-2">arrow_back</span>
                <span class="font-bold text-lg">My Wallet</span>
            </div>
            <div class="flex items-center space-x-4">
                <img src="https://ui-avatars.com/api/?name=User&background=random" class="w-8 h-8 rounded-full border border-slate-200">
            </div>
        </div>
    </header>

    <div class="max-w-3xl mx-auto px-4 py-8">
        
        <!-- User Stats -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">LinkUp User</h1>
                <p class="text-slate-500 text-sm">Member since 2026</p>
            </div>
            <div class="flex space-x-6 text-center">
                <div>
                    <p class="text-xl font-bold text-slate-900">3</p>
                    <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Tickets</p>
                </div>
                <div>
                    <p class="text-xl font-bold text-slate-900">12</p>
                    <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Events</p>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex space-x-2 mb-8 overflow-x-auto pb-2 scrollbar-hide">
            <button class="px-5 py-2 bg-slate-900 text-white rounded-full text-sm font-bold shadow-lg">Upcoming</button>
            <button class="px-5 py-2 bg-white text-slate-500 border border-slate-200 rounded-full text-sm font-bold hover:bg-slate-50">History</button>
            <button class="px-5 py-2 bg-white text-slate-500 border border-slate-200 rounded-full text-sm font-bold hover:bg-slate-50">Following</button>
        </div>

        <!-- Ticket 1: Active -->
        <div class="ticket-card bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden mb-6 relative group cursor-pointer">
            <!-- Visual Header -->
            <div class="h-48 relative">
                <img src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/20 to-transparent"></div>
                <div class="absolute top-4 left-4">
                    <span class="bg-white/20 backdrop-blur-md border border-white/20 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">Confirmed</span>
                </div>
                <div class="absolute bottom-4 left-6 text-white pr-6">
                    <h2 class="text-2xl font-bold leading-tight mb-1">Tech Summit 2026</h2>
                    <p class="text-white/80 text-sm flex items-center">
                        <span class="material-icons-outlined text-base mr-1">place</span> 東京国際フォーラム
                    </p>
                </div>
            </div>

            <!-- Body -->
            <div class="p-6 relative">
                <!-- Rip Line -->
                <div class="absolute -top-3 -left-3 w-6 h-6 bg-[#F8FAFC] rounded-full z-10"></div>
                <div class="absolute -top-3 -right-3 w-6 h-6 bg-[#F8FAFC] rounded-full z-10"></div>
                <div class="border-t-2 border-dashed border-slate-200 absolute top-0 left-4 right-4"></div>

                <div class="flex justify-between items-end pt-2">
                    <div class="space-y-3">
                        <div>
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">Date</p>
                            <p class="text-lg font-bold text-slate-800 flex items-center">
                                <span class="material-icons-outlined text-primary mr-2 text-lg">calendar_today</span>
                                2026/03/15
                            </p>
                        </div>
                        <div>
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">Time</p>
                            <p class="text-lg font-bold text-slate-800 flex items-center">
                                <span class="material-icons-outlined text-primary mr-2 text-lg">schedule</span>
                                13:00 - 18:00
                            </p>
                        </div>
                        <div>
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">Seat</p>
                            <p class="text-base font-bold text-slate-800">VIP Area / A-12</p>
                        </div>
                    </div>

                    <!-- QR Button -->
                    <div class="text-center">
                        <button class="bg-slate-900 text-white w-14 h-14 rounded-2xl flex items-center justify-center shadow-xl qr-glow hover:scale-105 transition mb-2">
                            <span class="material-icons-outlined text-2xl">qr_code_2</span>
                        </button>
                        <p class="text-[10px] font-bold text-slate-400">ENTRY CODE</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ticket 2: General -->
        <div class="ticket-card bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden mb-6 relative group cursor-pointer opacity-90 hover:opacity-100">
            <div class="h-32 relative">
                <img src="https://images.unsplash.com/photo-1493225255756-d9584f8606e9?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition duration-500">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent"></div>
                <div class="absolute bottom-4 left-6 text-white">
                    <h2 class="text-xl font-bold">Summer Music Fes</h2>
                    <p class="text-white/80 text-xs">幕張メッセ</p>
                </div>
            </div>
            <div class="p-5 flex justify-between items-center relative">
                 <div class="absolute -top-3 -left-3 w-6 h-6 bg-[#F8FAFC] rounded-full z-10"></div>
                <div class="absolute -top-3 -right-3 w-6 h-6 bg-[#F8FAFC] rounded-full z-10"></div>
                <div class="border-t-2 border-dashed border-slate-200 absolute top-0 left-4 right-4"></div>

                <div>
                    <p class="text-sm font-bold text-slate-800">2026/08/20 10:00</p>
                    <p class="text-xs text-slate-500">一般チケット x 2枚</p>
                </div>
                <button class="text-slate-400 hover:text-primary"><span class="material-icons-outlined">chevron_right</span></button>
            </div>
        </div>

    </div>

    <!-- Floating Action Button (Search) -->
    <button onclick="window.location.href='/'" class="fixed bottom-6 right-6 w-14 h-14 bg-primary text-white rounded-full shadow-2xl flex items-center justify-center hover:bg-blue-600 transition hover:-translate-y-1 z-50">
        <span class="material-icons-outlined text-2xl">search</span>
    </button>

</body>
</html>
