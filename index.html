<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkUp - イベント・コミュニティプラットフォーム</title>

  <!-- SEO -->
  <meta name="description" content="LinkUpは日本最大級のイベント・コミュニティプラットフォームです。テック、ビジネス、音楽、アートなど多彩なイベントが見つかります。">
  <meta property="og:title" content="LinkUp - イベント・コミュニティプラットフォーム">
  <meta property="og:description" content="人と体験をつなぐイベントプラットフォーム">
  <meta property="og:url" content="https://link-up.live">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://link-up.live">
  <link rel="icon" type="image/png" href="/assets/logo.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#2563EB' }
        }
      }
    }
  </script>

  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

  <style>
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background: #f8fafc; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body>

  <!-- ───── ナビゲーション ───── -->
  <nav class="bg-white border-b border-slate-100 sticky top-0 z-50 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <!-- ロゴ -->
      <button onclick="AppRouter.go('home')" class="text-2xl font-bold text-blue-600 tracking-tight">
        LinkUp
      </button>

      <!-- 右側 -->
      <div class="flex items-center gap-3">

        <!-- 未ログイン -->
        <div id="nav-auth" class="flex items-center gap-2">
          <button onclick="AppUI.openLoginModal()"
            class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 transition">
            ログイン
          </button>
          <button onclick="AppUI.openRegisterModal()"
            class="px-4 py-2 text-sm font-bold bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
            新規登録
          </button>
        </div>

        <!-- ログイン済み -->
        <div id="nav-user" class="hidden flex items-center gap-3">

          <!-- 主催者ダッシュボードボタン（organizer/admin のみ表示） -->
          <button id="nav-organizer-btn"
            onclick="AppRouter.go('organizer')"
            class="hidden items-center gap-1 px-3 py-1.5 text-xs font-medium text-purple-700 bg-purple-50 hover:bg-purple-100 border border-purple-200 rounded-lg transition">
            <span class="material-icons-outlined text-sm">event</span>
            <span class="hidden md:inline">主催者</span>
          </button>

          <!-- 管理コンソールボタン（admin のみ表示） -->
          <button id="nav-admin-btn"
            onclick="AppRouter.go('admin')"
            class="hidden items-center gap-1 px-3 py-1.5 text-xs font-medium text-red-700 bg-red-50 hover:bg-red-100 border border-red-200 rounded-lg transition">
            <span class="material-icons-outlined text-sm">admin_panel_settings</span>
            <span class="hidden md:inline">管理</span>
          </button>

          <!-- アバター＋名前（ダッシュボードへ） -->
          <button onclick="AppRouter.go('dashboard')"
            class="flex items-center gap-2 hover:opacity-80 transition">
            <img id="nav-avatar" src="" alt="avatar" class="w-8 h-8 rounded-full object-cover border border-slate-200">
            <span id="nav-name" class="text-sm font-medium text-slate-700 hidden md:block"></span>
          </button>

          <!-- ログアウト -->
          <button onclick="AppAuth.logout()"
            class="px-3 py-1.5 text-xs font-medium text-slate-500 hover:text-slate-700 border border-slate-200 rounded-lg hover:border-slate-300 transition">
            ログアウト
          </button>
        </div>

      </div>
    </div>
  </nav>

  <!-- ───── メインコンテンツ ───── -->
  <main id="app">
    <!-- AppRouter.init() がここにページを描画する -->
  </main>

  <!-- ───── モーダル ───── -->
  <div id="modal-container" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm"
       onclick="if(event.target===this) AppUI.closeModal()">
    <div id="modal-content"></div>
  </div>

  <!-- ───── JavaScript（読み込み順序が重要）───── -->

  <!-- 1. API クライアント（依存なし） -->
  <script src="/assets/js/core/api.js"></script>

  <!-- 2. UI ユーティリティ（依存なし） -->
  <script src="/assets/js/core/ui.js"></script>

  <!-- 3. 認証（API + UI に依存） -->
  <script src="/assets/js/core/auth.js"></script>

  <!-- 4. ルーター（Auth + UI に依存） -->
  <script src="/assets/js/core/router.js"></script>

  <!-- 5. ページ描画関数（Router + API に依存） -->
  <script src="/assets/js/pages/home.js"></script>
  <script src="/assets/js/pages/detail.js"></script>
  <script src="/assets/js/pages/dashboard.js"></script>
  <script src="/assets/js/pages/organizer.js"></script>

  <!-- 6. アプリ起動 -->
  <script>
    (async () => {
      // 認証状態を復元（tokenがあれば /api/auth/me を呼ぶ）
      await AppAuth.init();

      // URLに応じてページを表示
      AppRouter.init();
    })();
  </script>

</body>
</html>
